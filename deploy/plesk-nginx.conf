# Plesk → Websites & Domains → kinder.jan-krueger.org → Apache & nginx Settings
# → „Additional nginx directives“ – diesen Block komplett einfügen. „~ ^/“ statt „/“ vermeidet
# den Konflikt mit dem von Plesk selbst erzeugten „location /“.

location ~ ^/ {
	proxy_pass http://127.0.0.1:3120;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $http_connection;
	proxy_read_timeout 300s;
	client_max_body_size 25m;
}
