# Einmalige Prüfung externer Datenquellen (nur Hinweise im Lauf, keine Artefakte, kein Cache).
name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: VG250 Filter
        continue-on-error: true
        run: |
          set +e
          W='https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&version=2.0.0&request=GetFeature&srsName=EPSG:4326&outputFormat=application/json'
          {
          for sn in 03 04; do
            for t in vg250_lan vg250_krs vg250_gem; do
              curl -s -m 300 "$W&typeNames=vg250:$t&cql_filter=sn_l='$sn'%20AND%20gf=4" -o f.json
              echo "== $t sn_l=$sn: $(stat -c %s f.json) Bytes: $(python3 -c "import json;d=json.load(open('f.json'));print(len(d['features']), 'Objekte; Beispiel', [(f['properties']['ars'],f['properties']['gen'],f['properties']['bez']) for f in d['features'][:3]])" 2>&1 | head -c 400)"
              [ "$sn" = 04 ] && python3 -c "import json;d=json.load(open('f.json'));[print('  ',f['properties']['ars'],f['properties']['gen'],f['properties']['bez'],f['properties']['gf'],f['geometry']['type']) for f in d['features']]" 2>&1 | head -12
            done
          done
          echo "== Fehlerantwort Beispiel"; head -c 600 f.json
          curl -s -m 60 "https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&request=GetCapabilities&version=2.0.0" | grep -o '<ows:Title>[^<]*' | head -2
          } > out6.txt 2>&1; cat out6.txt
      - name: OSM Stadtteile Bremen
        continue-on-error: true
        run: |
          set +e
          curl -s -m 200 -A 'kinder-deutschlands-probe/1.0' --data-urlencode 'data=[out:json][timeout:120];area["ISO3166-2"="DE-HB"]["admin_level"="4"]->.a;rel["boundary"="administrative"]["admin_level"="10"](area.a);out tags;' https://overpass-api.de/api/interpreter -o st.json
          python3 -c "
          import json;d=json.load(open('st.json'))
          print(len(d['elements']))
          for e in d['elements']: print(e['id'], json.dumps({k:v for k,v in e['tags'].items() if k in ('name','ref','admin_level','de:regionalschluessel','de:amtlicher_gemeindeschluessel','wikidata','border_type','is_in')}, ensure_ascii=False))
          " > out7.txt 2>&1; cat out7.txt
      - name: Hinweise
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          for f in sorted(glob.glob('out*.txt')):
              t = open(f, errors='replace').read()
              for i in range(0, min(len(t), 3400 * 9), 3400):
                  c = t[i:i+3400].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::notice title={f}#{i//3400}::{c}')
          PY
