# Plesk → Websites & Domains → kinder-deutschlands.de → Apache & nginx Settings
# → „Additional nginx directives“ – diesen Block komplett einfügen
# (oder als Datei /var/www/vhosts/system/kinder-deutschlands.de/conf/vhost_nginx.conf, danach
# `/usr/local/psa/admin/bin/httpdmng --reconfigure-domain kinder-deutschlands.de && nginx -t`).
# Das Zertifikat muss kinder-deutschlands.de UND www.kinder-deutschlands.de enthalten. „~ ^/“ statt „/“ vermeidet
# den Konflikt mit dem von Plesk selbst erzeugten „location /“.

if ($host = www.kinder-deutschlands.de) { return 301 https://kinder-deutschlands.de$request_uri; }

location ~ ^/ {
	proxy_pass http://127.0.0.1:3120;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $http_connection;
	proxy_read_timeout 300s;
	client_max_body_size 25m;
}
