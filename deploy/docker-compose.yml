# Kinder Deutschlands – Stack für Portainer
# VORLAGE im Branch main. GitHub Actions setzt __WEB_IMAGE__ auf das frisch gebaute Image und
# veröffentlicht das Ergebnis im Branch „deploy“. Portainer liest NUR den Branch „deploy“.
# Geheimnisse kommen ausschließlich aus den Umgebungsvariablen des Portainer-Stacks:
#   APP_URL, APP_SECRET, POSTGRES_PASSWORD  (Pflicht)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM  (optional)

name: kinder-deutschlands

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: __WEB_IMAGE__
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:?APP_URL fehlt}
      ORIGIN: ${APP_URL}
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt}
      DATABASE_URL: postgres://kd:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@db:5432/kd
      BACKUP_DIR: /backups
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      BODY_SIZE_LIMIT: 25M
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_INSECURE_TLS: ${SMTP_INSECURE_TLS:-false}
      TILES_DIR: /data/tiles
      MEDIA_DIR: /data/media
      # Chat (Abschnitt 4): interner Chat-Server, Konfiguration schreibt die App selbst
      SYNAPSE_URL: http://synapse:8008
      SYNAPSE_CONFIG_DIR: /synapse-config
      SYNAPSE_CONFIG_PATH_IN_CONTAINER: /config
      CHAT_INTERNAL_URL: http://web:3000
      # Große Importe (Niedersachsen: ~15 000 Spielplätze mit Umriss) brauchen etwas Arbeitsspeicher
      NODE_OPTIONS: --max-old-space-size=1536
    ports:
      # Nur lokal erreichbar – öffentlich ausschließlich über Plesk (nginx, TLS)
      - "127.0.0.1:3120:3000"
    volumes:
      - backups:/backups
      - tiles:/data/tiles
      - media:/data/media
      - synapse-config:/synapse-config
    networks: [backend, frontend]
    mem_limit: 2g
    logging: *logging

  db:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kd
      POSTGRES_USER: kd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [backend]
    shm_size: 256mb
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd -d kd"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Chat-Server (Matrix/Synapse) – nur im internen Netz, keine Föderation, kein eigener Port nach außen.
  # Erreichbar für Browser ausschließlich über die App (/_matrix/client, /_matrix/media).
  # Startet sich selbst neu, wenn die App eine geänderte Konfiguration schreibt (Prüfung alle 30 s).
  synapse:
    image: ghcr.io/element-hq/synapse:v1.162.0
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      PYTHONPATH: /config
      TZ: Europe/Berlin
    volumes:
      - synapse-config:/config:ro
      - synapse-data:/data
    networks: [backend]
    mem_limit: 1g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/media_store && chown 991:991 /data /data/media_store
        sum() { cat /config/homeserver.yaml /config/kd_rules.py /config/signing.key 2>/dev/null | md5sum; }
        h=$$(sum)
        /start.py & p=$$!
        trap 'kill -TERM $$p; wait $$p; exit 0' TERM INT
        while kill -0 $$p 2>/dev/null; do
          sleep 30
          if [ "$$(sum)" != "$$h" ]; then echo "[synapse] Konfiguration geändert – Neustart"; kill -TERM $$p; wait $$p; exit 0; fi
        done
        wait $$p
    logging: *logging

  # Tägliche Sicherung (14 Tage). Schreibt last-backup.json für die Admin-Übersicht.
  backup:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - backups:/backups
      - media:/media:ro
      - synapse-data:/synapse:ro
    networks: [backend]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] gestartet, erste Sicherung in 2 Minuten"
        sleep 120
        while true; do
          ts=$$(date +%Y-%m-%dT%H-%M-%S)
          f=/backups/daily-$$ts.dump
          if pg_dump --format=custom --no-owner -h db -U kd -d kd -f "$$f"; then
            size=$$(stat -c %s "$$f")
            echo "{\"at\":\"$$(date -Iseconds)\",\"file\":\"daily-$$ts.dump\",\"ok\":true,\"size\":$$size}" > /backups/last-backup.json
            find /backups -name 'daily-*.dump' -mtime +14 -delete
            echo "[backup] ok: $$f ($$size Bytes)"
            # Hochgeladene Bilder (Community, Ortsfotos): letzte 3 Stände
            if [ -n "$$(ls -A /media 2>/dev/null)" ]; then
              tar -czf "/backups/media-$$ts.tar.gz" -C /media . && ls -1t /backups/media-*.tar.gz | tail -n +4 | xargs -r rm -f
            fi
            # Chat-Server: Datenbank (verschlüsselte Nachrichten, Schlüsselsicherungen) 14 Tage, Medien (verschlüsselt) letzte 3 Stände
            if psql -h db -U kd -d kd -tAc "select 1 from pg_database where datname = 'synapse'" | grep -q 1; then
              pg_dump --format=custom --no-owner -h db -U kd -d synapse -f "/backups/chat-$$ts.dump" && echo "[backup] ok: chat-$$ts.dump" || echo "[backup] FEHLER Chat-Datenbank"
              find /backups -name 'chat-*.dump' -mtime +14 -delete
            fi
            if [ -n "$$(ls -A /synapse/media_store 2>/dev/null)" ]; then
              tar -czf "/backups/chatmedien-$$ts.tar.gz" -C /synapse media_store && ls -1t /backups/chatmedien-*.tar.gz | tail -n +4 | xargs -r rm -f
            fi
          else
            echo "{\"at\":\"$$(date -Iseconds)\",\"ok\":false}" > /backups/last-backup.json
            echo "[backup] FEHLER"
          fi
          sleep 86400
        done
    logging: *logging

volumes:
  db:
  backups:
  tiles:
  media:
  synapse-config:
  synapse-data:

networks:
  backend:
    internal: true
  frontend:
