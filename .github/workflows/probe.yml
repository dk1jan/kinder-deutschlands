# Einmalige Prüfung externer Datenquellen (nur Hinweise im Lauf, keine Artefakte, kein Cache).
name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Overpass
        continue-on-error: true
        run: |
          set +e
          cat > op.py <<'PY'
          import json, sys, time, urllib.request, urllib.parse
          EP = ["https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]
          def q(data):
              for attempt in range(4):
                  for ep in EP:
                      try:
                          r = urllib.request.urlopen(urllib.request.Request(ep, data=urllib.parse.urlencode({"data": data}).encode(), headers={"User-Agent": "kinder-deutschlands-probe/1.0"}), timeout=200)
                          return ep, json.load(r)
                      except Exception as e:
                          last = f"{ep}: {e}"
                  time.sleep(20 * (attempt + 1))
              return last, None
          area = lambda iso: f'area["ISO3166-2"="{iso}"]["admin_level"="4"]->.a;'
          out = []
          for iso in ["DE-HB", "DE-NI"]:
              for f in ['["leisure"="playground"]', '["amenity"="toilets"]', '["changing_table"="yes"]["amenity"!="toilets"]', '["leisure"="indoor_play"]', '["tourism"="zoo"]', '["leisure"="water_park"]', '["amenity"="cafe"]["changing_table"="yes"]']:
                  ep, d = q(f'[out:json][timeout:180];{area(iso)}nwr{f}(area.a);out count;')
                  out.append(f"{iso} {f} -> {d['elements'][0]['tags']['total'] if d else 'FEHLER '+ep} ({ep.split('/')[2] if d else ''})")
          ep, d = q(f'[out:json][timeout:90];{area("DE-HB")}nwr["leisure"="playground"](area.a);out center tags 5;')
          if d:
              for e in d["elements"]:
                  out.append(f"{e['type']}/{e['id']} {e.get('center') or (e.get('lat'), e.get('lon'))} {json.dumps(e.get('tags'), ensure_ascii=False)[:300]}")
          ep, d = q(f'[out:json][timeout:90];{area("DE-HB")}rel["boundary"="administrative"]["admin_level"~"^(9|10)$"](area.a);out tags;')
          if d:
              lv = {}
              for e in d["elements"]:
                  lv.setdefault(e["tags"].get("admin_level"), []).append(e["tags"])
              for k, v in lv.items():
                  out.append(f"admin_level {k}: {len(v)} z.B. " + json.dumps([{x: t.get(x) for x in ("name", "ref", "de:regionalschluessel", "de:amtlicher_gemeindeschluessel", "is_in:city", "source", "border_type") if t.get(x)} for t in v[:3]], ensure_ascii=False))
          open("out1.txt", "w").write("\n".join(out))
          PY
          python3 op.py; cat out1.txt
      - name: VG250
        continue-on-error: true
        run: |
          set +e
          W='https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&version=2.0.0&request=GetFeature&srsName=EPSG:4326&outputFormat=application/json'
          {
          for t in vg250_lan vg250_krs vg250_gem vg250_vwg; do
            echo "== $t Attribute:"; curl -s -m 60 "$W&typeNames=vg250:$t&count=1" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d['features'][0]['properties'],ensure_ascii=False)[:900])"
          done
          for sn in 03 04; do
            for t in vg250_krs vg250_gem; do
              curl -s -m 180 "$W&typeNames=vg250:$t&cql_filter=SN_L='$sn'" -o f.json; echo "== $t SN_L=$sn: $(stat -c %s f.json) Bytes, $(python3 -c "import json;d=json.load(open('f.json'));print(len(d['features']), 'Objekte, GF:', sorted({f['properties'].get('GF') for f in d['features']}))" 2>&1 | head -c 300)"
            done
          done
          echo "== Bremen Gemeinden:"; curl -s -m 60 "$W&typeNames=vg250:vg250_gem&cql_filter=SN_L='04'" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(f['properties'].get('ARS'),f['properties'].get('AGS'),f['properties'].get('GEN'),f['properties'].get('BEZ'),f['properties'].get('GF')) for f in d['features']]"
          echo "== Stand:"; curl -s -m 60 "https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&request=GetCapabilities&version=2.0.0" | grep -io '<ows:Title>[^<]*\|<ows:Abstract>[^<]\{0,400\}\|Fees>[^<]*\|AccessConstraints>[^<]\{0,300\}' | head -8
          } > out2.txt 2>&1; cat out2.txt
      - name: Katalog Ortsteile Bremen
        continue-on-error: true
        run: |
          set +e
          for qq in "Ortsteile Bremen" "Stadtteile Bremen" "Verwaltungsgrenzen Bremen"; do
            echo "== $qq"
            curl -s -m 60 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST 'https://gdk.gdi-de.org/geonetwork/srv/api/search/records/_search' \
              -d "{\"size\":8,\"_source\":[\"resourceTitleObject\",\"link\",\"licenseObject\"],\"query\":{\"query_string\":{\"query\":\"$qq\"}}}" -o s.json
            head -c 200 s.json; echo
            python3 - <<'PY' || true
          import json
          d=json.load(open('s.json'))
          for h in d.get('hits',{}).get('hits',[]):
              s=h['_source']; print('-', (s.get('resourceTitleObject') or {}).get('default'), h['_id'])
              for l in (s.get('link') or [])[:4]:
                  u=(l.get('urlObject') or {}).get('default') or ''
                  if 'wfs' in u.lower() or 'atom' in u.lower() or l.get('protocol','').startswith('OGC:WFS'): print('    ', l.get('protocol'), u[:200])
          PY
          done > out3.txt 2>&1; cat out3.txt
      - name: Protomaps
        continue-on-error: true
        run: |
          set +e
          {
          curl -s -m 30 https://build-metadata.protomaps.dev/builds.json -o b.json; head -c 300 b.json; echo; python3 -c "import json;b=json.load(open('b.json'));print(b[-3:])"
          latest=$(python3 -c "import json;b=json.load(open('b.json'));print(b[-1]['key'])")
          v=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "go-pmtiles $v latest=$latest"
          curl -sL "https://github.com/protomaps/go-pmtiles/releases/download/$v/go-pmtiles_${v#v}_Linux_x86_64.tar.gz" | tar xz pmtiles && ./pmtiles version
          curl -sL "https://github.com/protomaps/go-pmtiles/releases/download/$v/checksums.txt" | grep -i linux | head -3
          ./pmtiles show "https://build.protomaps.com/$latest" 2>&1 | head -14
          for bb in "8.48,52.98,8.99,53.23" "8.3,52.9,9.2,53.65" "6.6,51.29,11.62,53.9"; do
            for z in 14 15; do echo "== bbox $bb z$z"; ./pmtiles extract "https://build.protomaps.com/$latest" out.pmtiles --bbox=$bb --maxzoom=$z --dry-run 2>&1 | tail -3; done
          done
          } > out4.txt 2>&1; cat out4.txt
      - name: basemaps-assets
        continue-on-error: true
        run: |
          set +e
          {
          curl -s https://api.github.com/repos/protomaps/basemaps-assets/commits/main | python3 -c "import json,sys;c=json.load(sys.stdin);print(c['sha'], c['commit']['committer']['date'])"
          curl -sL https://codeload.github.com/protomaps/basemaps-assets/tar.gz/refs/heads/main -o a.tgz; ls -la a.tgz
          mkdir x && tar xzf a.tgz -C x && ls x/*/ && ls x/*/fonts | head -30 && ls x/*/sprites && ls x/*/sprites/* | head -20
          du -sh x/*/fonts/"Noto Sans Regular" x/*/fonts/"Noto Sans Medium" x/*/fonts/"Noto Sans Italic" x/*/sprites/v4 2>&1
          ls x/*/fonts/"Noto Sans Regular" | wc -l
          } > out5.txt 2>&1; cat out5.txt
      - name: Hinweise
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          for f in sorted(glob.glob('out*.txt')):
              t = open(f, errors='replace').read()
              for i in range(0, min(len(t), 3400 * 9), 3400):
                  c = t[i:i+3400].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::notice title={f}#{i//3400}::{c}')
          PY
