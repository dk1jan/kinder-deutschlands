# Manuelle Prüfung externer Dienste. Nur Hinweise im Lauf, keine Artefakte, kein Cache.
name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prüfen
        run: |
          set +e
          cat > f.mjs <<'JS'
          const urls = [
            'https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&request=GetCapabilities&version=2.0.0',
            "https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&version=2.0.0&request=GetFeature&typeNames=vg250:vg250_krs&srsName=EPSG:4326&outputFormat=application/json&cql_filter=sn_l='04' AND gf=4",
            'https://opendata.lgln.niedersachsen.de/doorman/noauth/dop_wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0'
          ];
          for (const u of urls) {
            try { const r = await fetch(u); const t = await r.arrayBuffer(); console.log('OK', r.status, t.byteLength, u.slice(0, 90)); }
            catch (e) { console.log('FEHLER', u.slice(0, 90), e.message, String(e.cause?.code ?? ''), String(e.cause?.message ?? e.cause ?? '')); }
          }
          JS
          docker run --rm -v "$PWD:/w" -w /w node:24-alpine node f.mjs > out1.txt 2>&1
          # Luftbild Niedersachsen: Kachel Bremen-Mitte, Hannover, Bremerhaven (EPSG:3857, 256 px)
          tile() { curl -s -m 60 -o t.img -w "%{http_code} %{content_type} %{size_download}" "https://opendata.lgln.niedersachsen.de/doorman/noauth/dop_wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=ni_dop20&STYLES=&FORMAT=image/jpeg&CRS=EPSG:3857&WIDTH=256&HEIGHT=256&BBOX=$1"; python3 -c "
          from PIL import Image; im=Image.open('t.img').convert('L'); h=im.histogram(); print(' dunkel/weiß-Anteil', round((h[0]+h[255])/sum(h),3), 'Mittel', round(sum(i*v for i,v in enumerate(h))/sum(h)))" 2>/dev/null; echo; }
          { echo "Bremen Mitte:"; tile "979500,7000000,980100,7000600"
            echo "Bremen Findorff:"; tile "979000,7002500,979600,7003100"
            echo "Bremen Vegesack:"; tile "958500,7019000,959100,7019600"
            echo "Bremerhaven:"; tile "952300,7086500,952900,7087100"
            echo "Hannover:"; tile "1083500,6865000,1084100,6865600"
            curl -s -m 60 "https://opendata.lgln.niedersachsen.de/doorman/noauth/dop_wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0" | grep -o '<Fees>[^<]*\|<AccessConstraints>[^<]*\|<Name>[^<]*' | head -12
          } > out2.txt 2>&1
          for f in out1.txt out2.txt; do python3 -c "
          t=open('$f').read()[:3400].replace('%','%25').replace('\n','%0A'); print('::notice title=$f::'+t)"; done
